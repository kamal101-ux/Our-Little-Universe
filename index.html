<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Universe ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="stars"></div>

<div class="login-page">

<div class="glass">

<h1>❤️</h1>

<h2>Our Little Universe</h2>

<p>
Some memories belong only to two hearts...
</p>

<input
type="password"
id="password"
placeholder="Enter our secret">

<button id="unlockBtn">
Unlock ❤️
</button>

<p id="error"></p>

</div>

</div>

<div class="main-page" id="mainPage">

<header class="hero">

<h1>Happy Anniversary</h1>

<h2>Balozi ❤️ Naifat</h2>

<p>
Every picture tells a story...
Every memory reminds me of you.
</p>

</header>

<section class="counter">

    <h2>❤️ Our Journey Together ❤️</h2>

    <div id="loveTimer"></div>

</section>

<section class="gallery">

<h2>📸 Our Memories</h2>

<div class="photos" id="photoGallery"></div>

</section>

<section class="letter">

<h2>💌 My Letter</h2>

<div class="paper">

<p id="letterText"></p>

</div>

</section>

<footer>

<h2>I Love You ❤️</h2>

<p>Forever isn't long enough.</p>

</footer>

</div>
<div id="lightbox">

    <span id="close">&times;</span>

    <img id="lightboxImg">

    <button id="prev">&#10094;</button>

    <button id="next">&#10095;</button>

</div>
<audio id="bgMusic" loop>
<source src="music/bala-manhes.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

<script src="fireworks.js"></script>

</body>
</html>
